<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
</head>

<body>
    <div class="interface">

        <header>
            <hgroup>
                <h1>TELA DE LOGIN </h1>
            </hgroup>
        </header>

        <form class="formulario" action="principal.html" method="post">
            <div class="login">
                <p class="nomes_login">Usuário: </p>
                <input type="text" name="usuario" required>
            </div>
            <div class="login">
                <p class="nomes_login">Senha: </p>
                <input type="password" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>

    </div>
</body>

</html>
