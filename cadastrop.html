<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        body {
            background-color: forestgreen;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .interface {
            background-color: gray;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 420px;
            text-align: left;
        }

        header h1 {
            font-size: 20px;
            font-weight: bold;
            color: lawngreen;
            text-align: center;
            margin-bottom: 25px;
        }

        .cadp {
            margin-bottom: 15px;
        }

        .nomes_cadastrop {
            color: #fff;
            font-weight: 500;
            margin-bottom: 3px;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #fff !important;
            color: #212529 !important;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus {
            border-color: lawngreen;
            box-shadow: 0 0 5px rgba(124, 252, 0, 0.5);
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="interface">
        <header>
            <hgroup>
                <h1>CADASTRO DE PRODUTO</h1>
            </hgroup>
        </header>

        <form class="cadastro" action="principal.html" method="post">
            <div class="cadp">
                <p class="nomes_cadastrop">Nome do Produto: </p>
                <input type="text" name="nomep" required>
            </div>
            <div class="cadp">
                <p class="nomes_cadastrop">Código do Produto: </p>
                <input type="number" name="codigop" required>
            </div>
            <div class="cadp">
                <p class="nomes_cadastrop">Imagem do Produto: </p>
                <input type="file" name="fotop" accept="image/*" required>
            </div>
            <div class="cadp">
                <p class="nomes_cadastrop">Preço (R$): </p>
                <input type="number" name="precop" required>
            </div>
            <div class="cadp">
                <p class="nomes_cadastrop">Quantidade: </p>
                <input type="number" name="quantidadep" required>
            </div>
            <button type="submit">Cadastrar Produto</button>
        </form>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
