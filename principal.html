<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: forestgreen;
        }

        .interface {
            background-color: gray;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 380px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
            font-weight: bold;
            color: lawngreen;
            margin-bottom: 25px;
        }

        .menu-botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    </style>
    
</head>

<body>
    <div class="interface">
        <header>
            <hgroup>
                <h1>TELA PRINCIPAL</h1>
            </hgroup>
        </header>

        <div class="menu-botoes">
            <a href="cadastroc.html" class="btn btn-primary" role="button">Cadastro de Clientes</a>
            <a href="cadastrop.html" class="btn btn-primary" role="button">Cadastro de Produtos</a>
            <a href="listagem.html" class="btn btn-primary" role="button">Listagem de Produtos</a>
            <a href="login.html" class="btn btn-danger" role="button">Sair</a>
        </div>

    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>

</html>
