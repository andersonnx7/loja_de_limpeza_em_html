<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
</head>

<body>
    <div class="interface">
        <header>
            <hgroup>
                <h1>CADASTRO DE CLIENTE</h1>
            </hgroup>
        </header>

        <form class="cadastro" action="principal.html" method="post">
            <div class="cadc">
                <p class="nomes_cadastroc">Nome do Cliente: </p>
                <input type="text" name="nomec" required>
            </div>

            <div class="cadc">
                <p class="nomes_cadastroc">Código do Cliente: </p>
                <input type="number" name="codigoc" required>
            </div>

            <div class="cadc">
                <p class="nomes_cadastroc">Endereço (Rua, Número, Bairro)</p>
                <input type="text" name="endereçoc" required>
            </div>

            <div cad="cadc">
                <p class="nomes_cadastroc">Status do Cliente: </p>
                <select name="opcao_statusc" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="1">Bom</option>
                    <option value="2">Médio</option>
                    <option value="3">Ruim</option>
                </select>
            </div>
            <div class="cadc">
                <p class="nomes_cadastroc">Limite: </p>
                <input type="number" name="limitec" required>
            </div>
            <br>
            <button type="submit">Cadastrar Cliente</button>
        </form>

    </div>
</body>

</html>
