<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: forestgreen;
            margin: 0;
        }

        .interface {
            background-color: gray;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 420px;
            text-align: left;
        }

        header h1 {
            font-size: 20px;
            font-weight: bold;
            color: lawngreen;
            text-align: center;
            margin-bottom: 25px;
        }

        .cadc {
            margin-bottom: 15px;
        }

        .nomes_cadastroc {
            margin-bottom: 5px;
            font-weight: 500;
            color: #fff;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #fff !important;
            color: #212529 !important;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: lawngreen;
            outline: none;
            box-shadow: 0 0 5px rgba(124, 252, 0, 0.5);
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        select {
            background-color: #ffffff !important;
            color: #212529 !important;
            color-scheme: light;    
        }

        select option {
            background-color: #ffffff !important;
            color: #212529 !important;
        }
    </style>
</head>

<body>
    <div class="interface">
        <header>
            <hgroup>
                <h1>CADASTRO DE CLIENTE</h1>
            </hgroup>
        </header>

        <form class="cadastro" action="principal.html" method="post">
            <div class="cadc">
                <p class="nomes_cadastroc">Nome do Cliente: </p>
                <input type="text" name="nomec" required>
            </div>

            <div class="cadc">
                <p class="nomes_cadastroc">Código do Cliente: </p>
                <input type="number" name="codigoc" required>
            </div>

            <div class="cadc">
                <p class="nomes_cadastroc">Endereço (Rua, Número, Bairro)</p>
                <input type="text" name="endereçoc" required>
            </div>

            <div class="cadc">
                <p class="nomes_cadastroc">Status do Cliente: </p>
                <select name="opcao_statusc" class="form-select" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="1">Bom</option>
                    <option value="2">Médio</option>
                    <option value="3">Ruim</option>
                </select>
            </div>
            <div class="cadc">
                <p class="nomes_cadastroc">Limite: </p>
                <input type="number" name="limitec" required>
            </div>
            <br>
            <button type="submit">Cadastrar Cliente</button>
        </form>

    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>

</html>
